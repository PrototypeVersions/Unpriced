name: UNPRICED Market Cycle

on:
  schedule:
    - cron: '45 8 * * 1-5'
      timezone: 'America/New_York'
    - cron: '35 9 * * 1-5'
      timezone: 'America/New_York'
    - cron: '20 13 * * 1-5'
      timezone: 'America/New_York'
    - cron: '20 16 * * 1-5'
      timezone: 'America/New_York'
  workflow_dispatch:
    inputs:
      mode:
        description: 'Cycle to run'
        required: true
        type: choice
        options:
          - premarket
          - execute
          - close

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: unpriced-market-cycle
  cancel-in-progress: false

jobs:
  cycle:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install engine dependencies
        run: pip install -r requirements.txt

      - name: Select cycle mode
        id: mode
        shell: bash
        run: |
          if [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then
            MODE="${{ inputs.mode }}"
          else
            case "${{ github.event.schedule }}" in
              "45 8 * * 1-5") MODE="premarket" ;;
              "35 9 * * 1-5") MODE="execute" ;;
              "20 13 * * 1-5"|"20 16 * * 1-5") MODE="close" ;;
              *) echo "Unknown schedule"; exit 1 ;;
            esac
          fi
          echo "mode=$MODE" >> "$GITHUB_OUTPUT"
          echo "Running $MODE cycle"

      - name: Run market engine
        run: python engine.py "${{ steps.mode.outputs.mode }}"

      - name: Validate generated JSON
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          for p in Path('data').glob('*.json'):
              json.loads(p.read_text())
              print('valid', p)
          for folder in ('forecasts','states'):
              for p in Path(folder).glob('*.json') if Path(folder).exists() else []:
                  json.loads(p.read_text())
                  print('valid', p)
          PY

      - name: Commit forward record
        shell: bash
        run: |
          git config user.name "unpriced-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data forecasts states
          if git diff --cached --quiet; then
            echo "No state change to commit."
          else
            git commit -m "market-cycle: ${{ steps.mode.outputs.mode }} $(date -u +%Y-%m-%dT%H:%M:%SZ)"
            git push
          fi

      - name: Configure Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: '.'

      - name: Deploy Pages
        id: deployment
        uses: actions/deploy-pages@v4
        with:
          token: ${{ github.token }}
