name: UNPRICED Market Cycle

on:
  # GitHub's schedule queue can lag or drop runs; redundant triggers are
  # idempotent and each mode enforces the real NYSE time boundary.
  schedule:
    - cron: '45 8 * * 1-5'
      timezone: 'America/New_York'
    - cron: '53 8 * * 1-5'
      timezone: 'America/New_York'
    - cron: '35 9 * * 1-5'
      timezone: 'America/New_York'
    - cron: '42 9 * * 1-5'
      timezone: 'America/New_York'
    - cron: '35 13 * * 1-5'
      timezone: 'America/New_York'
    - cron: '49 13 * * 1-5'
      timezone: 'America/New_York'
    - cron: '35 16 * * 1-5'
      timezone: 'America/New_York'
    - cron: '47 16 * * 1-5'
      timezone: 'America/New_York'
    - cron: '7 17 * * 1-5'
      timezone: 'America/New_York'
    - cron: '37 17 * * 1-5'
      timezone: 'America/New_York'
    - cron: '7 18 * * 1-5'
      timezone: 'America/New_York'
  # Code repair to this workflow automatically attempts a current-session
  # close ONLY if the market calendar/time/data guards permit it.
  push:
    branches: [main]
    paths:
      - '.github/workflows/market-cycle.yml'
  workflow_dispatch:
    inputs:
      mode:
        description: 'Cycle to run'
        required: true
        type: choice
        options:
          - premarket
          - execute
          - close

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: unpriced-market-cycle
  cancel-in-progress: false

jobs:
  cycle:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install engine dependencies
        run: pip install -r requirements.txt

      - name: Select cycle mode
        id: mode
        shell: bash
        run: |
          if [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then
            MODE="${{ inputs.mode }}"
          elif [[ "${{ github.event_name }}" == "push" ]]; then
            MODE="close"
          else
            case "${{ github.event.schedule }}" in
              "45 8 * * 1-5"|"53 8 * * 1-5") MODE="premarket" ;;
              "35 9 * * 1-5"|"42 9 * * 1-5") MODE="execute" ;;
              "35 13 * * 1-5"|"49 13 * * 1-5"|"35 16 * * 1-5"|"47 16 * * 1-5"|"7 17 * * 1-5"|"37 17 * * 1-5"|"7 18 * * 1-5") MODE="close" ;;
              *) echo "Unknown schedule"; exit 1 ;;
            esac
          fi
          echo "mode=$MODE" >> "$GITHUB_OUTPUT"
          echo "Running $MODE cycle"

      - name: Require completed current-session daily bar before close publication
        if: steps.mode.outputs.mode == 'close' && github.event_name != 'push'
        run: |
          python - <<'PY'
          from datetime import datetime, timedelta
          from zoneinfo import ZoneInfo
          import pandas as pd
          import pandas_market_calendars as mcal
          import yfinance as yf

          tz=ZoneInfo('America/New_York')
          today=datetime.now(tz).date()
          sched=mcal.get_calendar('NYSE').schedule(start_date=today.isoformat(), end_date=today.isoformat())
          if sched.empty:
              print('No NYSE session today; engine will safely no-op.')
              raise SystemExit(0)
          close_et=sched.iloc[0]['market_close'].tz_convert(tz).to_pydatetime()
          if datetime.now(tz) < close_et + timedelta(minutes=35):
              print('Exchange has not closed and settled yet; early-close fallback safely no-ops.')
              raise SystemExit(0)
          raw=yf.download('SPY',period='10d',interval='1d',auto_adjust=True,progress=False)
          if raw.empty:
              raise SystemExit('SPY daily data unavailable; refusing to publish.')
          latest=pd.Timestamp(raw.dropna(how='all').index[-1]).date()
          if latest != today:
              raise SystemExit(f'Latest completed SPY daily bar is {latest}, not {today}; refusing to publish stale close data.')
          print('Current-session SPY daily bar confirmed:', latest)
          PY

      - name: Run market engine
        run: python engine.py "${{ steps.mode.outputs.mode }}"

      - name: Audit actual NYSE session outcome
        # An Actions success does not imply the exchange-time deadline was met.
        # Also preserves a missed-run record when GitHub dropped a trigger entirely.
        run: python scripts/audit_session.py

      - name: Validate generated JSON
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          for p in Path('data').glob('*.json'):
              json.loads(p.read_text())
              print('valid', p)
          for folder in ('forecasts','states'):
              for p in Path(folder).glob('*.json') if Path(folder).exists() else []:
                  json.loads(p.read_text())
                  print('valid', p)
          PY

      - name: Refresh generated status documentation
        run: python scripts/sync_docs.py

      - name: Commit forward record
        shell: bash
        run: |
          git config user.name "unpriced-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data forecasts states docs/AI_HANDOFF.md docs/MODEL_CARD_V1.md docs/ROADMAP.md
          if git diff --cached --quiet; then
            echo "No state change to commit."
          else
            git commit -m "market-cycle: ${{ steps.mode.outputs.mode }} $(date -u +%Y-%m-%dT%H:%M:%SZ)"
            for attempt in 1 2 3; do
              if git push; then exit 0; fi
              echo "Push conflict on attempt $attempt; retrying without rewriting history."
              git fetch origin main
              if ! git rebase origin/main; then
                git rebase --abort || true
                echo "Cannot safely rebase generated record; aborting for a scheduled retry."
                exit 1
              fi
            done
            echo "Could not push after 3 attempts."
            exit 1
          fi

      - name: Configure Pages when enabled
        id: pages_config
        continue-on-error: true
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: Upload Pages artifact
        if: steps.pages_config.outcome == 'success'
        uses: actions/upload-pages-artifact@v3
        with:
          path: '.'

      - name: Deploy Pages
        if: steps.pages_config.outcome == 'success'
        uses: actions/deploy-pages@v4
        with:
          token: ${{ github.token }}
