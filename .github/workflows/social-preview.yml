name: Build Social Preview

on:
  push:
    branches: [main]
    paths:
      - 'assets/unpriced-preview.svg'
      - '.github/workflows/social-preview.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  render:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install renderer
        run: pip install cairosvg

      - name: Render PNG
        run: |
          python - <<'PY'
          import cairosvg
          cairosvg.svg2png(
              url='assets/unpriced-preview.svg',
              write_to='assets/unpriced-preview.png',
              output_width=1200,
              output_height=630,
          )
          PY

      - name: Commit rendered preview
        run: |
          git config user.name "unpriced-bot"
          git config user.email "actions@users.noreply.github.com"
          git add assets/unpriced-preview.png
          if git diff --cached --quiet; then
            echo "Preview already current."
          else
            git commit -m "assets: render social preview PNG"
            git push
          fi
