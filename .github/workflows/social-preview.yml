name: Build Social Preview

on:
  push:
    branches: [main]
    paths:
      - 'assets/unpriced-preview.svg'
      - '.github/workflows/social-preview.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  render:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install renderer
        run: pip install cairosvg

      - name: Render PNG without cropping approved artwork
        run: |
          python - <<'PY'
          from pathlib import Path
          import cairosvg

          src = Path('assets/unpriced-preview.svg').read_text()
          # Preserve the entire approved artwork inside the standard 1200x630
          # Open Graph canvas instead of cropping it to fill the frame.
          src = src.replace('preserveAspectRatio="xMidYMid slice"',
                            'preserveAspectRatio="xMidYMid meet"')
          # Give any narrow side gutters a dark background rather than transparency.
          src = src.replace('>', '><rect width="1200" height="630" fill="#020d16"/>', 1)

          cairosvg.svg2png(
              bytestring=src.encode('utf-8'),
              write_to='assets/unpriced-preview.png',
              output_width=1200,
              output_height=630,
          )
          PY

      - name: Commit rendered preview
        run: |
          git config user.name "unpriced-bot"
          git config user.email "actions@users.noreply.github.com"
          git add assets/unpriced-preview.png
          if git diff --cached --quiet; then
            echo "Preview already current."
          else
            git commit -m "assets: render uncropped social preview PNG"
            git push
          fi
